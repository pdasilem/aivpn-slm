services:
  # AIVPN Server
  aivpn-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /run:mode=1777,size=64M
      - /tmp:mode=1777,size=128M
    mem_limit: 800m
    memswap_limit: 800m
    cpu_shares: 512
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    command:
      - "--listen"
      - "0.0.0.0:443"
      - "--key-file"
      - "/etc/aivpn/server.key"
      - "--clients-db"
      - "/etc/aivpn/clients.json"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    volumes:
      - ./config:/etc/aivpn
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "com.aivpn.service=gateway"
      - "com.aivpn.version=0.3.0"

  # Admin Web UI (management via aivpn-admin CLI)
  aivpn-admin-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/aivpn-admin-web"]
    command:
      - "--bind"
      - "0.0.0.0:27449"
      - "--admin-bin"
      - "/usr/local/bin/aivpn-admin"
      - "--clients-db"
      - "/etc/aivpn/clients.json"
      - "--key-file"
      - "/etc/aivpn/server.key"
      - "--server-ip"
      - "${AIVPN_SERVER_IP:?Set AIVPN_SERVER_IP in .env, for example 5.152.13.186:443}"
      - "--token-file"
      - "/etc/aivpn/admin.token"
      - "--update-repo-dir"
      - "${PWD:-.}"
    environment:
      - AIVPN_ADMIN_TOKEN=${AIVPN_ADMIN_TOKEN:-}
    volumes:
      - ./config:/etc/aivpn
      - .:${PWD:-/opt/aivpn}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "27449:27449"
    labels:
      - "com.aivpn.service=admin-web"
      - "com.aivpn.version=0.3.0"

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - aivpn

  # Grafana
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - aivpn
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  aivpn:
    driver: bridge
