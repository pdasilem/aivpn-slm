plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFile = keystoreProperties.getProperty('storeFile') ?: System.getenv('AIVPN_UPLOAD_STORE_FILE')
def releaseStorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv('AIVPN_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('AIVPN_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv('AIVPN_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = 'com.aivpn.client'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.aivpn.client"
        minSdk = 26
        targetSdk = 36
        versionCode = 7
        versionName = "0.5.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                setStoreFile(file(releaseStoreFile))
                setStorePassword(releaseStorePassword)
                setKeyAlias(releaseKeyAlias)
                setKeyPassword(releaseKeyPassword)
                setEnableV1Signing(true)
                setEnableV2Signing(true)
            }
        }
    }

    buildTypes {
        release {
            setMinifyEnabled(false)
            setShrinkResources(false)
            if (hasReleaseSigning) {
                setSigningConfig(signingConfigs.release)
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            lint {
                setCheckReleaseBuilds(false)
                setAbortOnError(false)
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    buildFeatures {
        viewBinding = true
    }

    // Rust .so files produced by build-rust-android.sh
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // ABI splits — smaller APKs per architecture
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // EncryptedSharedPreferences for secure key storage
    implementation 'androidx.security:security-crypto:1.1.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
